<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vecchio Frantoio - Gestione Prenotazioni</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121214; color: #f4f4f5; padding: 10px; padding-bottom: 25px; }
        
        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .logo { font-size: 18px; font-weight: bold; color: #f59e0b; display: flex; align-items: center; gap: 5px; }
        .header-btns { display: flex; gap: 6px; }
        .btn-hdr { background: #27272a; color: #e4e4e7; border: 1px solid #3f3f46; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; }

        /* CONTROLS BAR */
        .controls-card { background: #1c1c20; border: 1px solid #27272a; border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .ctrl-group label { display: block; font-size: 9px; font-weight: 700; color: #9ca3af; text-transform: uppercase; margin-bottom: 3px; letter-spacing: 0.4px; }
        .ctrl-group input, .ctrl-group select { width: 100%; background: #27272a; color: #fff; border: 1px solid #3f3f46; border-radius: 6px; padding: 5px 6px; font-size: 12px; outline: none; }

        /* ROOM TABS HORIZONTAL SCROLL */
        .tabs-wrapper { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
        .tabs-wrapper::-webkit-scrollbar { display: none; }
        .tab-pill { background: #27272a; color: #d4d4d8; border: none; padding: 6px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
        .tab-pill.active { background: #f59e0b; color: #000; }
        .tab-pill.event-tab { background: #8b5cf6; color: #fff; }

        /* SECTION SUBHEADER */
        .sec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .sec-title { font-size: 16px; font-weight: 700; }
        .counters { font-size: 12px; font-weight: 600; }
        .c-free { color: #22c55e; margin-right: 8px; }
        .c-occ { color: #ef4444; }

        /* TABLES GRID COMPATTA (FORCE 5 COLUMNS) */
        .tables-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px; }

        .table-card { aspect-ratio: 1 / 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; cursor: pointer; transition: transform 0.1s; position: relative; text-align: center; }
        .table-card:active { transform: scale(0.95); }
        .table-card.free { background: #092615; border: 1.5px solid #22c55e; color: #22c55e; }
        .table-card.occupied { background: #380d0f; border: 1.5px solid #ef4444; color: #ef4444; }
        
        .t-num { font-size: 16px; font-weight: 800; color: #fff; line-height: 1; margin-bottom: 2px; }
        .t-status { font-size: 9px; font-weight: 700; text-transform: uppercase; }
        .t-name { font-size: 9px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 95%; font-weight: 600; margin-top: 1px; }
        .t-occ-badge { background: #ef4444; color: #fff; font-size: 8px; font-weight: 800; padding: 1px 3px; border-radius: 3px; margin-bottom: 1px; }

        /* MODALS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: #1c1c20; border-top: 2px solid #f59e0b; border-top-left-radius: 16px; border-top-right-radius: 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 16px; animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-title { font-size: 16px; font-weight: 700; color: #f59e0b; margin-bottom: 12px; text-align: center; }
        
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: #a1a1aa; margin-bottom: 3px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; background: #27272a; color: #fff; border: 1px solid #3f3f46; border-radius: 6px; padding: 8px; font-size: 13px; outline: none; }
        .form-group textarea { resize: vertical; height: 50px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .btn-gold { background: #f59e0b; color: #000; font-weight: 700; border: none; border-radius: 6px; padding: 10px; width: 100%; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .btn-purple { background: #8b5cf6; color: #fff; font-weight: 700; border: none; border-radius: 6px; padding: 10px; width: 100%; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .btn-cancel { background: #27272a; color: #e4e4e7; font-weight: 600; border: 1px solid #3f3f46; border-radius: 6px; padding: 8px; width: 100%; font-size: 13px; cursor: pointer; margin-top: 6px; }

        /* EVENT SECTION STYLING */
        .sec-banner { background: #27272a; border-left: 3px solid #f59e0b; padding: 5px 8px; font-weight: 700; font-size: 12px; color: #f59e0b; margin: 12px 0 8px 0; }
        .empty-box { text-align: center; color: #71717a; font-size: 13px; padding: 30px 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌿 Vecchio Frantoio</div>
        <div class="header-btns">
            <button class="btn-hdr" onclick="alert('Statistiche disponibili nello storico.')">📊 Statistiche</button>
            <button class="btn-hdr" onclick="alert('Registro Generale attivo.')">📋 Registro</button>
        </div>
    </header>

    <div class="controls-card">
        <div class="ctrl-group">
            <label>Data</label>
            <input type="date" id="current-date" onchange="renderView()">
        </div>
        <div class="ctrl-group">
            <label>Orario</label>
            <input type="time" id="current-time" value="20:00" onchange="renderView()">
        </div>
        <div class="ctrl-group">
            <label>Servizio</label>
            <select id="current-shift" onchange="renderView()">
                <option value="Cena">Cena</option>
                <option value="Pranzo">Pranzo</option>
            </select>
        </div>
    </div>

    <div class="tabs-wrapper" id="tabs-wrapper"></div>

    <div id="main-view"></div>

    <div class="modal" id="booking-modal">
        <div class="modal-content">
            <div class="modal-title" id="booking-modal-title">Prenota Tavolo</div>
            <form onsubmit="saveBooking(event)">
                <input type="hidden" id="modal-table-num">
                <div class="form-group">
                    <label>Nome cliente</label>
                    <input type="text" id="b-name" placeholder="Es. Famiglia Rossi / Prova" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Coperti</label>
                        <input type="number" id="b-guests" value="2" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Telefono</label>
                        <input type="tel" id="b-phone" placeholder="Es. 3331234567">
                    </div>
                </div>
                <div class="form-group">
                    <label>Note (Allergie, intolleranze, richieste...)</label>
                    <textarea id="b-notes" placeholder="Es. Celiaco, seggiolone..."></textarea>
                </div>
                <button type="submit" class="btn-gold">Conferma prenotazione</button>
                <button type="button" class="btn-cancel" onclick="closeModal('booking-modal')">Annulla</button>
            </form>
        </div>
    </div>

    <div class="modal" id="event-modal">
        <div class="modal-content" style="border-top-color: #8b5cf6;">
            <div class="modal-title" style="color:#8b5cf6;">🎉 Preventivo & Evento Frantoio</div>
            <form onsubmit="saveEvent(event)">
                <div class="sec-banner">Dati Cliente & Evento</div>
                <div class="form-group">
                    <label>Nome Cliente / Festeggiato</label>
                    <input type="text" id="ev-name" placeholder="Es. Mario Rossi" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Telefono</label>
                        <input type="tel" id="ev-phone" placeholder="3331234567">
                    </div>
                    <div class="form-group">
                        <label>Tipo Evento</label>
                        <select id="ev-type">
                            <option value="Compleanno">Compleanno</option>
                            <option value="Matrimonio">Matrimonio</option>
                            <option value="Laurea">Laurea</option>
                            <option value="Cresima / Comunione">Cresima / Comunione</option>
                            <option value="Altro">Altro</option>
                        </select>
                    </div>
                </div>

                <div class="sec-banner">Spazio & Sale Riservate</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Sala Riservata</label>
                        <select id="ev-room"></select>
                    </div>
                    <div class="form-group">
                        <label>N° Persone / Coperti</label>
                        <input type="number" id="ev-guests" value="30">
                    </div>
                </div>
                <div class="form-group">
                    <label>Tavoli Riservati (es. 1, 2, 3 o Tutti)</label>
                    <input type="text" id="ev-tables" placeholder="Es. Tavoli 1, 2, 3 e 4">
                </div>

                <div class="sec-banner">Menu & Portate</div>
                <div class="form-group"><input type="text" id="ev-benvenuto" placeholder="Benvenuto: Es. Prosecco e stuzzichini"></div>
                <div class="form-group"><input type="text" id="ev-antipasto" placeholder="Antipasto: Es. Tagliere Frantoio e frittelline"></div>
                <div class="form-group"><input type="text" id="ev-primo" placeholder="Primo / i: Es. Paccheri ai funghi e salsiccia"></div>
                <div class="form-group"><input type="text" id="ev-secondo" placeholder="Secondo / i: Es. Grigliata mista con patate"></div>
                <div class="form-group"><input type="text" id="ev-dolci" placeholder="Frutta & Dolci / Torta: Es. Torta Millefoglie"></div>

                <div class="sec-banner">Dettagli & Extra</div>
                <div class="form-row">
                    <div class="form-group"><input type="text" id="ev-addobbi" placeholder="Addobbi / Tovaglia"></div>
                    <div class="form-group"><input type="text" id="ev-musica" placeholder="Musica / SIAE"></div>
                </div>
                <div class="form-group">
                    <input type="text" id="ev-notes" placeholder="Intolleranze / Allergie / Note: Es. 2 celiaci">
                </div>

                <div class="sec-banner">Preventivo Economico (€)</div>
                <div class="form-row">
                    <div class="form-group"><label>Prezzo a Persona (€)</label><input type="number" id="ev-price" placeholder="35"></div>
                    <div class="form-group"><label>Totale Evento (€)</label><input type="number" id="ev-total" placeholder="Totale"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Acconto Versato (€)</label><input type="number" id="ev-deposit" value="0"></div>
                    <div class="form-group"><label>Orario di Uscita</label><input type="text" id="ev-exit" placeholder="Es. Ore 01:30"></div>
                </div>

                <button type="submit" class="btn-purple">Salva Preventivo / Evento</button>
                <button type="button" class="btn-cancel" onclick="closeModal('event-modal')">Annulla</button>
            </form>
        </div>
    </div>

    <script>
        // CONFIGURAZIONE SALE E CAPACITA'
        const ROOMS = {
            "Sala Esterna": 18,
            "Sala 1": 15,
            "Sala 2": 12,
            "Sala Vetrata": 10,
            "Sala Privée": 9
        };

        let currentActiveTab = "Sala Esterna";

        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('current-date').value = today;
            setupRoomSelects();
            renderView();
        });

        function getBookings() { return JSON.parse(localStorage.getItem('vf_bookings') || '[]'); }
        function saveBookings(data) { localStorage.setItem('vf_bookings', JSON.stringify(data)); }
        function getEvents() { return JSON.parse(localStorage.getItem('vf_events') || '[]'); }
        function saveEvents(data) { localStorage.setItem('vf_events', JSON.stringify(data)); }

        function setupRoomSelects() {
            const evRoom = document.getElementById('ev-room');
            if(!evRoom) return;
            evRoom.innerHTML = '';
            Object.keys(ROOMS).forEach(r => {
                evRoom.innerHTML += `<option value="${r}">${r}</option>`;
            });
        }

        function renderTabs() {
            const wrapper = document.getElementById('tabs-wrapper');
            wrapper.innerHTML = '';

            Object.keys(ROOMS).forEach(r => {
                const btn = document.createElement('button');
                btn.className = `tab-pill ${r === currentActiveTab ? 'active' : ''}`;
                btn.innerText = `${r} (${ROOMS[r]})`;
                btn.onclick = () => { currentActiveTab = r; renderView(); };
                wrapper.appendChild(btn);
            });

            // TAB EVENTI
            const evBtn = document.createElement('button');
            evBtn.className = `tab-pill event-tab ${currentActiveTab === 'EVENTI' ? 'active' : ''}`;
            evBtn.innerText = `🎉 Eventi & Festeggiamenti`;
            evBtn.onclick = () => { currentActiveTab = 'EVENTI'; renderView(); };
            wrapper.appendChild(evBtn);
        }

        function renderView() {
            renderTabs();
            const mainView = document.getElementById('main-view');
            mainView.innerHTML = '';

            if (currentActiveTab === 'EVENTI') {
                renderEventsView(mainView);
            } else {
                renderTablesView(mainView);
            }
        }

        function renderTablesView(container) {
            const curDate = document.getElementById('current-date').value;
            const curShift = document.getElementById('current-shift').value;
            const bookings = getBookings();

            const totalTables = ROOMS[currentActiveTab];
            let occCount = 0;

            let gridHtml = '';
            for (let i = 1; i <= totalTables; i++) {
                const b = bookings.find(item => item.date === curDate && item.shift === curShift && item.room === currentActiveTab && item.table == i);
                
                if (b) {
                    occCount++;
                    gridHtml += `
                        <div class="table-card occupied" onclick="handleTableClick(${i}, true)">
                            <div class="t-occ-badge">OCC.</div>
                            <div class="t-num">${i}</div>
                            <div class="t-name">${b.name}</div>
                        </div>
                    `;
                } else {
                    gridHtml += `
                        <div class="table-card free" onclick="handleTableClick(${i}, false)">
                            <div class="t-num">${i}</div>
                            <div class="t-status">LIBERO</div>
                        </div>
                    `;
                }
            }

            const freeCount = totalTables - occCount;

            container.innerHTML = `
                <div class="sec-header">
                    <div class="sec-title">${currentActiveTab}</div>
                    <div class="counters">
                        <span class="c-free">🟢 Liberi: ${freeCount}</span>
                        <span class="c-occ">🔴 Occupati: ${occCount}</span>
                    </div>
                </div>
                <div class="tables-grid">${gridHtml}</div>
            `;
        }

        function renderEventsView(container) {
            const events = getEvents();

            let eventsListHtml = '';
            if (events.length === 0) {
                eventsListHtml = `<div class="empty-box">Nessun evento registrato.</div>`;
            } else {
                events.forEach(e => {
                    eventsListHtml += `
                        <div style="background:#1c1c20; border:1px solid #3f3f46; border-radius:8px; padding:10px; margin-bottom:8px;">
                            <div style="font-size:14px; font-weight:700; color:#8b5cf6;">🎉 ${e.name} (${e.type})</div>
                            <div style="font-size:11px; color:#a1a1aa; margin-top:3px;">📅 ${e.room} - ${e.guests} Ospiti</div>
                        </div>
                    `;
                });
            }

            container.innerHTML = `
                <div class="sec-header">
                    <div class="sec-title">🎉 Gestione Eventi & Festa</div>
                    <button class="btn-hdr" style="background:#f59e0b; color:#000; font-weight:700;" onclick="openModal('event-modal')">+ Nuovo Evento</button>
                </div>
                <div>${eventsListHtml}</div>
            `;
        }

        function handleTableClick(tableNum, isOccupied) {
            if (isOccupied) {
                if (confirm(`Vuoi liberare il Tavolo ${tableNum}?`)) {
                    const curDate = document.getElementById('current-date').value;
                    const curShift = document.getElementById('current-shift').value;
                    let bookings = getBookings();
                    bookings = bookings.filter(b => !(b.date === curDate && b.shift === curShift && b.room === currentActiveTab && b.table == tableNum));
                    saveBookings(bookings);
                    renderView();
                }
            } else {
                document.getElementById('booking-modal-title').innerText = `Prenota Tavolo ${tableNum} - ${currentActiveTab}`;
                document.getElementById('modal-table-num').value = tableNum;
                document.getElementById('b-name').value = '';
                document.getElementById('b-guests').value = '2';
                document.getElementById('b-phone').value = '';
                document.getElementById('b-notes').value = '';
                openModal('booking-modal');
            }
        }

        function saveBooking(e) {
            e.preventDefault();
            const tableNum = document.getElementById('modal-table-num').value;
            const newBooking = {
                id: Date.now(),
                date: document.getElementById('current-date').value,
                shift: document.getElementById('current-shift').value,
                room: currentActiveTab,
                table: tableNum,
                name: document.getElementById('b-name').value,
                guests: document.getElementById('b-guests').value,
                phone: document.getElementById('b-phone').value,
                notes: document.getElementById('b-notes').value
            };

            const bookings = getBookings();
            bookings.push(newBooking);
            saveBookings(bookings);
            closeModal('booking-modal');
            renderView();
        }

        function saveEvent(e) {
            e.preventDefault();
            const newEv = {
                id: Date.now(),
                name: document.getElementById('ev-name').value,
                phone: document.getElementById('ev-phone').value,
                type: document.getElementById('ev-type').value,
                room: document.getElementById('ev-room').value,
                guests: document.getElementById('ev-guests').value
            };

            const events = getEvents();
            events.push(newEv);
            saveEvents(events);
            closeModal('event-modal');
            renderView();
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    </script>
</body>
</html>
